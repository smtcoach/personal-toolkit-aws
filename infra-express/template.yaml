AWSTemplateFormatVersion: "2010-09-09"
Description: Cost-conscious EC2 and Docker infrastructure for the CloudDesk Express API.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  SubscriptionTableName:
    Type: String
    Default: clouddesk-subscriptions
  CorsOrigin:
    Type: String
    Default: https://d1l863cphghqlg.cloudfront.net

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: CloudDesk

  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmptyOnDelete: false
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the latest ten images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      RepositoryName: clouddesk-api
      Tags:
        - Key: Project
          Value: CloudDesk

  DeploymentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldBuildSources
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: CloudDesk

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP access to the CloudDesk Express API
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: clouddesk-api
        - Key: Project
          Value: CloudDesk

  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CloudDeskTasksTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt TasksTable.Arn
        - PolicyName: CloudDeskSubscriptionsTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionTableName}
        - PolicyName: CloudDeskApiImagePull
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ApiRepository.Arn
        - PolicyName: CloudDeskDeploymentSourceRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DeploymentBucket.Arn}/*

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BackendRole

  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref BackendInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref BackendSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 8
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          dnf install -y docker
          systemctl enable --now docker

          for attempt in $(seq 1 60); do
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${ApiRepository.RepositoryUri} || true
            if docker pull ${ApiRepository.RepositoryUri}:latest; then
              docker rm -f clouddesk-api || true
              docker run -d \
                --name clouddesk-api \
                --restart unless-stopped \
                -p 80:3000 \
                -e AWS_REGION=${AWS::Region} \
                -e TASKS_TABLE_NAME=${TasksTable} \
                -e SUBSCRIPTIONS_TABLE_NAME=${SubscriptionTableName} \
                -e COGNITO_USER_POOL_ID=${CognitoUserPoolId} \
                -e COGNITO_CLIENT_ID=${CognitoClientId} \
                -e CORS_ORIGIN=${CorsOrigin} \
                ${ApiRepository.RepositoryUri}:latest
              exit 0
            fi
            sleep 10
          done
          exit 1
      Tags:
        - Key: Name
          Value: clouddesk-api
        - Key: Project
          Value: CloudDesk

  BackendElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref BackendInstance
      Tags:
        - Key: Name
          Value: clouddesk-api
        - Key: Project
          Value: CloudDesk

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudDeskImageBuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${DeploymentBucket.Arn}/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ApiRepository.Arn

  ApiImageBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: clouddesk-api-image
      Description: Builds the CloudDesk Express Docker image and pushes it to ECR.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !GetAtt ApiRepository.RepositoryUri
          - Name: IMAGE_TAG
            Value: initial
      Source:
        Type: S3
        Location: !Sub ${DeploymentBucket}/backend-express.zip
      TimeoutInMinutes: 15
      Tags:
        - Key: Project
          Value: CloudDesk

Outputs:
  TasksTableName:
    Value: !Ref TasksTable
  SubscriptionTableName:
    Value: !Ref SubscriptionTableName
  RepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  DeploymentBucketName:
    Value: !Ref DeploymentBucket
  CodeBuildProjectName:
    Value: !Ref ApiImageBuild
  BackendInstanceId:
    Value: !Ref BackendInstance
  BackendPublicIp:
    Value: !Ref BackendElasticIp
  BackendOriginDomain:
    Value: !GetAtt BackendInstance.PublicDnsName
  BackendHealthUrl:
    Value: !Sub http://${BackendInstance.PublicDnsName}/health
